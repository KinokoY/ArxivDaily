# Public configuration. Copy to config.toml and adjust interests as needed.
# Credentials are read from environment variables named below; never paste
# SendKey or API keys into this file.

[workflow]
mode = "summary"

[translation]
provider = "llm"
base_url = "https://api-free.deepl.com"
api_key_env = "TRANSLATION_API_KEY"
timeout = 30
attempts = 3
retry_delay_seconds = 1

[collection]
page_size = 100
delay_seconds = 3.0
initial_days = 7
lookback_days = 14
shard_limit = 10000
# Maximum newly discovered rule candidates in one run. Already known base IDs
# may still be returned with updated metadata without spending this cap.
max_candidates = 2000

[rules]
categories = ["cs.CV", "cs.LG", "cs.AI", "eess.IV"]
title_enabled = false
exclude = []

# Defaults in arxivdaily.config define synonym groups and five routes.
# Add or replace a group with [rules.groups], and a route with [rules.routes].
# A route is OR across clauses; each clause is AND across named groups.
# Example:
# [rules.groups]
# CUSTOM = ["phrase one", "phrase two"]
# [rules.routes]
# custom_route = [["SEG", "CUSTOM"], ["MED", "CUSTOM"]]
# general_reasoning = []  # Disable a default route.
# Matching uses abstract only unless title_enabled is explicitly true.

[limits]
full_daily_limit = 5  # Hard maximum 10; excess selected papers become light.
review_daily_limit = 2
stage_attempts = 3
recovery_days = 14
run_seconds = 2400

[llm]
# Optional run spending cap: max_run_cost = 12.5

[llm.filter]
provider = "deepseek"
protocol = "chat_completions"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
effort = "high"
max_tokens = 16384
timeout = 120
stage_seconds = 180
attempts = 3
retry_delay_seconds = 1
image_capable = false
input_chars = 30000

[llm.summary]
provider = "deepseek"
protocol = "chat_completions"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
effort = "max"
max_tokens = 65536
timeout = 240
stage_seconds = 900
attempts = 3
retry_delay_seconds = 1
image_capable = true
input_chars = 120000
max_section_calls = 64

# DeepSeek Flash peak rates, CNY per million tokens, verified 2026-10-02:
# https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
# Peak rates give an upper-bound estimate, not an exact invoice. If replacing
# these rates, set policy = "custom" and verify the new provider's prices.
[llm.pricing]
cache_hit_per_million = 0.04
cache_miss_per_million = 2.0
output_per_million = 8.0
currency = "CNY"
policy = "peak_upper_bound"

[fulltext]
timeout = 30
attempts = 3
min_chars = 2500
chunk_chars = 20000
max_download_bytes = 25000000
max_visual_pages = 8

[delivery]
sendkey_env = "SERVERCHAN_SENDKEY"
daily_limit = 5
chain_attempts = 3
poll_limit = 3
body_bytes = 30000
quota_timezone = "Asia/Shanghai"
query_counts_quota = false

[archive]
public_base_url = "https://raw.githubusercontent.com/KinokoY/ArxivDaily/arxivdaily-state"
state_branch = "arxivdaily-state"
