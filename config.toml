# ArxivDaily 唯一公开配置入口。改此文件后提交到 main，下一次 Actions 生效。
# 不要写入任何 API key 或 SendKey；运行凭证由环境变量 / GitHub Actions Secrets 提供。
# 配置说明：docs/CONFIGURATION.md；提示说明：docs/PROMPTS.md。

# 日常入口一：工作流。summary = 全文总结；translation = 标题和摘要双语，不读取正文。
[workflow]
mode = "summary"

# arXiv 初筛：任一交叉分类命中即可；categories=[] 表示不限分类。
# 默认关键词匹配标题与摘要。
[rules]
categories = ["cs.CV", "cs.LG", "cs.AI", "cs.CL"]
title_enabled = true
exclude = []

# 同义词组：同组词之间是 OR，大小写不敏感，按完整词和短语匹配。
[rules.groups]

# Segmentation 基础任务
SEG = [
    "segmentation",
    "segmenting",
    "segmentation mask",
    "semantic segmentation",
    "instance segmentation",
    "referring segmentation",
    "pixel-level perception",
    "pixel-wise perception",
    "vessel segmentation"
]

# Reasoning / instruction / grounding segmentation
REASON = [
    "reasoning segmentation",
    "reasoning-based segmentation",
    "reasoning-aware segmentation",
    "reasoning referring segmentation",
    "referring image segmentation",
    "referring expression segmentation",
    "instruction-guided segmentation",
    "prompt-guided segmentation",
    "language-guided segmentation",
    "visual grounding",
    "grounded segmentation",
    "position reasoning",
    "positional reasoning",
    "spatial reasoning",
    "medical reasoning",
    "implicit query",
    "implicit queries",
    "implicit instruction",
    "complex instruction",
    "chain-of-thought",
    "chain of thought",
    "visual reasoning"
]

# Vision-Language / Multimodal LLM
